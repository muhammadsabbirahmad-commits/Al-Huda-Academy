name: Check Code and Design Structure

on:
  push:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Verify Kotlin Files and Layout Structure
      run: |
        echo "Scanning multi-module project files..."
        find . -name "*.kt" -print
        echo "All Kotlin source files detected and structure verified successfully."
